<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' – First Java CRUD'"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container narrow">
    <a class="back" th:href="@{/}">← Back to products</a>
    <section class="form-card">
        <p class="eyebrow">Student 72016</p>
        <h1 th:text="${pageTitle}"></h1>
        <form th:action="@{/products/save}" th:object="${product}" method="post">
            <input type="hidden" th:field="*{id}">
            <label>Name <input type="text" th:field="*{name}" maxlength="80" required autofocus></label>
            <p class="field-error" th:errors="*{name}"></p>
            <label>Category <input type="text" th:field="*{category}" maxlength="50" required></label>
            <p class="field-error" th:errors="*{category}"></p>
            <label>Price (PLN) <input type="number" step="0.01" min="0" max="99999999.99" th:field="*{price}" required></label>
            <p class="field-error" th:errors="*{price}"></p>
            <label>Quantity <input type="number" min="0" max="1000000" th:field="*{quantity}" required></label>
            <p class="field-error" th:errors="*{quantity}"></p>
            <div class="form-actions">
                <button class="button primary" type="submit">Save product</button>
                <a class="button secondary" th:href="@{/}">Cancel</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
